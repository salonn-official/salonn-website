<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — salonn</title>
  <meta name="theme-color" content="#F5C518" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nf { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
    .nf__code { font-size: clamp(70px, 16vw, 140px); font-weight: 900; line-height: 1; color: var(--ink); }
    .nf__code mark { border-radius: 16px; }
    .nf p { color: var(--text-soft); font-size: 18px; }
  </style>
</head>
<body>
  <main class="nf container">
    <div class="nf__code">4<mark>0</mark>4</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a class="btn btn--play" href="/"><span>Back to salonn</span></a>
  </main>
</body>
</html>
