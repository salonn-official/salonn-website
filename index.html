<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Salonn — Book salons & barbershops near you | salonn.hair</title>
  <meta name="description" content="Salonn is the easiest way to discover and book top-rated salons and barbershops near you in Sambalpur, Hirakud, Burla and beyond. Real-time slots, online payment, instant confirmation." />
  <meta name="keywords" content="Salonn, salon booking, barber booking, salon near me, Sambalpur salon, Hirakud salon, Burla salon, book haircut online, beauty parlour booking" />
  <meta name="author" content="Salonn" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#0e0e0e" />
  <link rel="canonical" href="https://www.salonn.hair/" />

  <!-- Open Graph (WhatsApp / Facebook / LinkedIn link previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Salonn" />
  <meta property="og:title" content="Salonn — Book salons & barbershops near you" />
  <meta property="og:description" content="Discover and book top-rated salons and barbershops near you. Real-time slots, secure online payment, instant confirmation." />
  <meta property="og:url" content="https://www.salonn.hair/" />
  <meta property="og:image" content="https://www.salonn.hair/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Salonn — Book salons & barbershops near you" />
  <meta name="twitter:description" content="Discover and book top-rated salons and barbershops near you. Real-time slots, secure online payment, instant confirmation." />
  <meta name="twitter:image" content="https://www.salonn.hair/og-image.png" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FFD700'/><text x='50' y='72' font-size='64' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23141414'>S</text></svg>" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Structured data: tells Google this is the official Salonn site + wires
       the sitelinks search box for brand searches -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.salonn.hair/#org",
        "name": "Salonn",
        "url": "https://www.salonn.hair/",
        "logo": "https://www.salonn.hair/logo.png",
        "description": "Salonn helps you discover and book top-rated salons and barbershops near you.",
        "email": "support.salonn@gmail.com",
        "areaServed": "IN"
      },
      {
        "@type": "WebSite",
        "@id": "https://www.salonn.hair/#website",
        "url": "https://www.salonn.hair/",
        "name": "Salonn",
        "publisher": { "@id": "https://www.salonn.hair/#org" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": { "@type": "EntryPoint", "urlTemplate": "https://www.salonn.hair/?q={search_term_string}" },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "MobileApplication",
        "name": "Salonn",
        "operatingSystem": "ANDROID",
        "applicationCategory": "LifestyleApplication",
        "url": "https://play.google.com/store/apps/details?id=com.salonn.salonn",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <!-- Splash screen (matches the Salonn app: gold ground, dark tile + wordmark) -->
  <div id="splash" class="splash">
    <div class="sp-center">
      <div class="sp-logo">S</div>
      <div class="sp-word">
        <span style="--i:0">S</span><span style="--i:1">a</span><span style="--i:2">l</span><span style="--i:3">o</span><span style="--i:4">n</span><span style="--i:5">n</span>
      </div>
      <div class="sp-tag">Book beauty, effortlessly.</div>
    </div>
    <div class="sp-ver">SALONN · salonn.hair</div>
  </div>

  <noscript>
    <div style="max-width:640px;margin:40px auto;padding:0 20px;font-family:system-ui,sans-serif;color:#f5f5f5;background:#0e0e0e">
      <h1>Salonn — Book salons &amp; barbershops near you</h1>
      <p>Salonn helps you discover and book top-rated salons and barbershops near you in Sambalpur, Hirakud, Burla and nearby areas. Browse salons, see real-time available slots, pay securely online and get instant confirmation.</p>
      <p>Please enable JavaScript to use Salonn, or <a href="https://play.google.com/store/apps/details?id=com.salonn.salonn" style="color:#ffd700">get the Salonn app on Google Play</a>.</p>
    </div>
  </noscript>

  <div class="app">

    <!-- ─────────── HOME ─────────── -->
    <section class="screen" id="screen-home">
      <header class="app-head">
        <div class="hbrand"><span class="brand-mark small">S</span><b>Salonn</b></div>
        <button class="loc loc-right" id="locBtn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
          <span><small>Your location</small><b id="locLabel">Enable location</b></span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
      </header>

      <div class="scroll">
        <h1 class="sr-only">Salonn — Book salons and barbershops near you</h1>
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
          <input id="searchInput" placeholder="Search salons, areas…" />
        </div>

        <div class="chips" id="cats"></div>

        <div id="featured"></div>

        <div class="sec-head"><h2>Salons near you</h2><span class="muted" id="count"></span></div>
        <div class="list" id="salonList">
          <div class="empty">Finding salons around you…</div>
        </div>
        <div class="pad"></div>
      </div>
    </section>

    <!-- ─────────── EXPLORE ─────────── -->
    <section class="screen" id="screen-explore" hidden>
      <header class="app-head simple"><h1>Explore</h1></header>
      <div class="scroll">
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
          <input id="reelSearch" placeholder="Search salons…" />
        </div>
        <div class="reel-grid" id="reelGrid"><div class="empty">Loading reels…</div></div>
        <div class="pad"></div>
      </div>
    </section>

    <!-- ─────────── BOOKINGS ─────────── -->
    <section class="screen" id="screen-bookings" hidden>
      <header class="app-head simple"><h1>Bookings</h1></header>
      <div class="scroll" id="bookingsBody"></div>
    </section>

    <!-- ─────────── PROFILE ─────────── -->
    <section class="screen" id="screen-profile" hidden>
      <header class="app-head simple"><h1>Profile</h1></header>
      <div class="scroll" id="profileBody"></div>
    </section>

    <!-- ─────────── SALON DETAIL (overlay) ─────────── -->
    <section class="screen detail" id="screen-detail" hidden>
      <div class="scroll" id="detailBody"></div>
      <div class="detail-bar">
        <div><small class="muted">Total</small><b id="detailPrice">₹0</b></div>
        <button class="btn gold" id="detailBook">Book appointment</button>
      </div>
    </section>

    <!-- ─────────── TABS (bottom on mobile, top nav on desktop) ─────────── -->
    <nav class="tabbar">
      <a class="tb-brand" href="#"><span class="brand-mark small">S</span><b>Salonn</b></a>
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg><span>Home</span>
      </button>
      <button class="tab" data-tab="explore">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.5 6.5-2 4.5-4.5 2 2-4.5z"/></svg><span>Explore</span>
      </button>
      <button class="tab" data-tab="bookings">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2Zm12 8v10H5V10z"/></svg><span>Bookings</span>
      </button>
      <button class="tab" data-tab="profile">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6Z"/></svg><span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- Reel / post viewer — vertical Instagram-style feed -->
  <div id="reelViewer" class="reelview" hidden>
    <button class="rv-close" id="rvClose">✕</button>
    <div class="rv-feed" id="rvFeed"></div>
  </div>

  <!-- Auth modal (login → onboarding, no separate sign-up) -->
  <div id="authModal" class="modal" hidden>
    <div class="sheet" id="authBody"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Sheet modal host (booking / review) -->
  <div id="sheetModal" class="modal" hidden><div class="sheet" id="sheetBody"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
